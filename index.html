<!DOCTYPE html>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --neon-red: #ff003c;
            --neon-dim: #5a0015;
            --bg-color: #050505;
            --slot-bg: #0f0f0f;
            --grid-line: #1a1a1a;
        }

        body {
            font-family: 'Share Tech Mono', monospace;
            background-color: var(--bg-color);
            color: #e0e0e0;
            background-image: 
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 20px 20px;
            overflow-x: hidden;
        }

        /* Scanline Overlay */
        .crt::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 100;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        /* Grid System */
        .mc-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 6px;
            width: 100%;
            max-width: 340px;
            aspect-ratio: 1/1;
            background: #111;
            padding: 8px;
            border: 1px solid #333;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        .mc-slot {
            background: var(--slot-bg);
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: all 0.2s;
            overflow: hidden;
        }

        .mc-slot:hover { border-color: #555; }
        
        .mc-slot.occupied {
            background: linear-gradient(135deg, #1a0505 0%, #000 100%);
            border: 1px solid var(--neon-red);
            box-shadow: inset 0 0 10px rgba(255,0,60,0.1);
        }

        .item-size-1 { grid-column: span 1; grid-row: span 1; }
        .item-size-2 { grid-column: span 2; grid-row: span 1; }
        .item-size-3 { grid-column: span 3; grid-row: span 1; }

        /* Navigation Tabs */
        .nav-btn {
            background: transparent;
            border: 1px solid #333;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        
        .nav-btn.active {
            background: var(--neon-red);
            color: black;
            border-color: var(--neon-red);
            box-shadow: 0 0 15px var(--neon-red);
            font-weight: bold;
        }

        .nav-btn:hover:not(.active) {
            border-color: #666;
            color: #fff;
        }

        /* Rarities */
        .rarity-comum { color: #a1a1aa; border-color: #52525b; }
        .rarity-incomum { color: #4ade80; border-color: #059669; }
        .rarity-raro { color: #3b82f6; border-color: #1d4ed8; }
        .rarity-épico { color: #d946ef; border-color: #a21caf; }
        .rarity-lendário { color: #fbbf24; border-color: #b45309; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--neon-red); }

        .tab-content { display: none; animation: fadeIn 0.3s ease-out; }
        .tab-content.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>

        // --- CORE FUNCTIONS ---

        function getSlotUsage() {
            return inventory.reduce((acc, item) => acc + item.slots, 0);
        }

        function notificar(msg, type='info') {
            const area = document.getElementById('notification-area');
            const div = document.createElement('div');
            const color = type === 'error' ? 'text-red-500 border-red-900' : 'text-[#ff003c] border-[#ff003c]';
            div.className = `bg-black border p-2 text-xs font-bold uppercase tracking-widest shadow-lg ${color} animate-bounce`;
            div.innerText = msg;
            area.appendChild(div);
            setTimeout(() => div.remove(), 3000);
            
            // Adicionar ao log
            const log = document.getElementById('activity-log');
            const entry = document.createElement('li');
            entry.innerText = `> ${msg}`;
            log.prepend(entry);
        }

        function adicionarItem(id) {
            const item = ITEMS.find(i => i.id === id);
            if (!item) return;

            if (getSlotUsage() + item.slots > 9) {
                notificar("MOCHILA CHEIA! LIBERE ESPAÇO.", "error");
                return;
            }

            const instance = { ...item, uid: Date.now() + Math.random() };
            inventory.push(instance);
            notificar(`+ ${item.nome}`);
            renderAll();
        }

        function removerItem(uid) {
            inventory = inventory.filter(i => i.uid !== uid);
            renderAll();
        }

            const missing = [];
            recipe.req.forEach(req => {
                const count = inventory.filter(i => i.id === req.id).length;
                if (count < req.q) missing.push(`${req.q - count}x ${ITEMS.find(x => x.id === req.id).nome}`);
            });

            if (missing.length > 0) {
                notificar(`Falta: ${missing.join(', ')}`, "error");
                return;
            }

            // Consumir
            recipe.req.forEach(req => {
                for(let i=0; i<req.q; i++) {
                    const idx = inventory.findIndex(x => x.id === req.id);
                    if(idx > -1) inventory.splice(idx, 1);
                }
            });

            // Adicionar resultado
            adicionarItem(recipe.result);
            // Se o item resultante tiver quantidade > 1 (ex: munição), adicionar o resto
            // A função adicionarItem já trata um item, se a receita diz q:3, precisamos adicionar mais 2 loops
            // Mas minha função adicionarItem chama renderAll. Para evitar spam, vamos fazer um loop silencioso ou apenas chamar add
            for(let i=1; i<recipe.q; i++) {
                // Adiciona sem notificação visual excessiva para os extras, ou apenas chama a função
                 const item = ITEMS.find(x => x.id === recipe.result);
                 if (getSlotUsage() + item.slots <= 9) {
                     inventory.push({ ...item, uid: Date.now() + Math.random() });
                 }
            }
            notificar(`FABRICADO: ${ITEMS.find(i=>i.id === recipe.result).nome}`);
            renderAll();
        }

        function limparTudo() {
            if(confirm("Resetar todo o inventário?")) {
                inventory = [];
                renderAll();
            }
        }

        // --- RENDERIZAÇÃO ---

        function renderAll() {
            localStorage.setItem('border_inv_v4', JSON.stringify(inventory));
            renderMochila();
            renderDatabase(); // Para atualizar status de receitas se estiver na aba, mas opcional
            renderCrafting();
            lucide.createIcons();
        }

        function renderMochila() {
            const grid = document.getElementById('main-grid');
            grid.innerHTML = '';
            
            // Render Slots
            inventory.forEach(item => {
                const div = document.createElement('div');
                div.className = `mc-slot occupied item-size-${item.slots} group cursor-pointer`;
                div.onclick = () => removerItem(item.uid);
                
                // Icon Logic (Simple Text fallback or Lucide)
                let iconName = 'package';
                if(item.tipo.includes('Arma')) iconName = 'sword';
                if(item.tipo.includes('Fogo')) iconName = 'crosshair';
                if(item.tipo.includes('Medicina')) iconName = 'heart-pulse';
                if(item.tipo.includes('Material')) iconName = 'box';

                div.innerHTML = `
                    <i data-lucide="${iconName}" class="mb-1 text-white/50 group-hover:text-[#ff003c] transition-colors" size="16"></i>
                    <span class="text-[9px] font-bold text-center leading-tight uppercase px-1 ${getRarityColor(item.raridade)}">${item.nome}</span>
                    <div class="absolute top-0 right-0 p-1 opacity-0 group-hover:opacity-100 bg-black/80 text-[8px] text-red-500 font-bold">X</div>
                `;
                grid.appendChild(div);
            });

            // Empty Slots Fill
            const used = getSlotUsage();
            const total = 9;
            document.getElementById('slot-counter').innerText = `${used} / ${total}`;
            document.getElementById('bar-carga').style.width = `${(used/total)*100}%`;

            // Preenche visualmente apenas se não for sistema fluido. Como é grid Minecraft (3x3 fixo),
            // a lógica de "fill" é complexa com itens de tamanhos variados. 
            // Abordagem simples: Grid CSS lida com posicionamento. Se sobrar espaço visual no DOM, 
            // preenchemos com div vazias apenas para manter a grade se não houver itens suficientes.
            // Mas com itens de tamanhos variados, preencher "buracos" exatos é difícil via JS simples.
            // Vamos deixar o Grid CSS organizar os itens e preencher o resto com slots vazios 1x1 até 9 elementos DOM totais?
            // Não, melhor deixar apenas os itens e o fundo do container fazer o resto. 
            // Para visual de grid vazio:
            if (inventory.length === 0) {
                 for(let i=0; i<9; i++) {
                     grid.innerHTML += `<div class="bg-[#111] border border-[#222] rounded-sm opacity-20"></div>`;
                 }
            }
        }

        function renderDatabase() {
            const list = document.getElementById('database-list');
            const search = document.getElementById('search-loot').value.toLowerCase();
            const filter = document.getElementById('filter-loot').value;

            list.innerHTML = '';

            ITEMS.filter(item => {
                const matchText = item.nome.toLowerCase().includes(search) || item.tipo.toLowerCase().includes(search);
                const matchFilter = filter === 'all' || item.raridade === filter;
                return matchText && matchFilter;
            }).forEach(item => {
                const div = document.createElement('div');
                div.className = "flex justify-between items-center bg-zinc-900/40 p-2 border border-zinc-800 hover:border-zinc-600 transition-all group";
                div.innerHTML = `
                    <div class="flex flex-col">
                        <span class="text-[10px] font-bold uppercase ${getRarityColor(item.raridade)}">${item.nome}</span>
                        <span class="text-[8px] text-zinc-600 uppercase">${item.tipo} • ${item.slots} SLOT(S)</span>
                    </div>
                    <button onclick="adicionarItem('${item.id}')" class="text-zinc-500 hover:text-[#ff003c] transition-colors">
                        <i data-lucide="plus-square" size="18"></i>
                    </button>
                `;
                list.appendChild(div);
            });
            lucide.createIcons();
        }

        function renderCrafting() {
            const list = document.getElementById('recipes-list');
            list.innerHTML = '';

            RECIPES.forEach((rec, idx) => {
                const resultItem = ITEMS.find(i => i.id === rec.result);
                
                // Check if craftable
                let craftable = true;
                const ingredientsHTML = rec.req.map(r => {
                    const have = inventory.filter(x => x.id === r.id).length;
                    const name = ITEMS.find(x => x.id === r.id).nome;
                    if(have < r.q) craftable = false;
                    const color = have >= r.q ? 'text-green-500' : 'text-red-500';
                    return `<span class="${color} text-[9px] block">• ${have}/${r.q} ${name}</span>`;
                }).join('');

                const div = document.createElement('div');
                div.className = `p-3 border ${craftable ? 'border-zinc-600 bg-zinc-900/50 hover:border-green-500 cursor-pointer' : 'border-zinc-900 bg-black opacity-60 cursor-not-allowed'} transition-all`;
                if(craftable) div.onclick = () => { craftItem(idx); mostrarPreview(idx); };
                div.onclick = () => mostrarPreview(idx); // Mostra mesmo se não der pra craftar

                div.innerHTML = `
                    <div class="flex justify-between mb-1">
                        <span class="text-xs font-bold uppercase ${getRarityColor(resultItem.raridade)}">${resultItem.nome}</span>
                        ${craftable ? '<i data-lucide="hammer" size="12" class="text-green-500"></i>' : '<i data-lucide="lock" size="12" class="text-zinc-700"></i>'}
                    </div>
                `;
                list.appendChild(div);
            });
        }

        function mostrarPreview(idx) {
            const rec = RECIPES[idx];
            const item = ITEMS.find(i => i.id === rec.result);
            const container = document.getElementById('craft-preview');
            
            // Check ingredients again for preview
            let btnClass = "bg-zinc-800 text-zinc-500 cursor-not-allowed";
            let btnText = "MATERIAIS INSUFICIENTES";
            let canCraft = true;
            
            const ingList = rec.req.map(r => {
                const have = inventory.filter(x => x.id === r.id).length;
                const iData = ITEMS.find(x => x.id === r.id);
                if(have < r.q) canCraft = false;
                return `
                    <div class="flex justify-between text-[10px] w-full border-b border-zinc-800 py-1">
                        <span class="text-zinc-400">${iData.nome}</span>
                        <span class="${have >= r.q ? 'text-green-500' : 'text-red-500'} font-mono">${have}/${r.q}</span>
                    </div>
                `;
            }).join('');

            if(canCraft) {
                btnClass = "bg-[#ff003c] text-black hover:bg-white hover:shadow-[0_0_15px_#ff003c] cursor-pointer";
                btnText = "FABRICAR ITEM";
            }

            container.classList.remove('opacity-50');
            container.innerHTML = `
                <div class="text-4xl mb-2 text-zinc-700 p-4 border border-zinc-800 bg-black">
                    <i data-lucide="package" size="48"></i>
                </div>
                <h2 class="text-lg font-bold uppercase ${getRarityColor(item.raridade)} mb-1">${item.nome}</h2>
                <p class="text-[10px] text-zinc-500 mb-6 uppercase tracking-widest">${rec.desc}</p>
                
                <div class="w-full max-w-xs bg-black p-4 border border-zinc-800 mb-6">
                    <h4 class="text-[9px] text-zinc-500 uppercase mb-2 text-left">Componentes Necessários:</h4>
                    ${ingList}
                </div>

                <button onclick="${canCraft ? `craftItem(${idx})` : ''}" class="w-full max-w-xs py-3 font-bold uppercase tracking-widest transition-all ${btnClass}">
                    ${btnText}
                </button>
            `;
            lucide.createIcons();
        }

        // --- UTILS ---

        function getRarityColor(raridade) {
            const map = {
                'Comum': 'text-zinc-400',
                'Incomum': 'text-green-400',
                'Raro': 'text-blue-400',
                'Épico': 'text-purple-400',
                'Lendário': 'text-amber-400'
            };
            return map[raridade] || 'text-white';
        }

        function mudarAba(aba) {
            // UI Update
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`tab-btn-${aba}`).classList.add('active');
            
            // Content Update
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.getElementById(`tab-${aba}`).classList.add('active');
            
            if(aba === 'craft') renderCrafting();
            if(aba === 'loot') renderDatabase();
        }

        window.exportarImagem = () => {
            html2canvas(document.body).then(canvas => {
                const link = document.createElement('a');
                link.download = 'borderland-inv-full.png';
                link.href = canvas.toDataURL();
                link.click();
            });
        };

        // Init
        renderAll();
        lucide.createIcons();
    </script>
</body>
